<style>
  :root{
    --pine:#0f1b2d; --teal:#1c6fd9; --teal-d:#0f4fa8; --teal-soft:#e8f0fd;
    --amber:#f2971d; --amber-soft:#fdecd2;
    --bg:#f2f6fb; --card:#ffffff; --line:#dde6f0; --muted:#5c7189;
    --shadow-sm:0 1px 2px rgba(15,31,51,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--pine); font-size:16px; line-height:1.35; padding-bottom:24px;
  }
  .num{font-variant-numeric:tabular-nums;}
  header{
    background:linear-gradient(135deg,var(--teal) 0%,var(--teal-d) 100%);
    color:#fff; padding:16px 16px 14px; position:sticky; top:0; z-index:20;
    box-shadow:0 4px 20px -6px rgba(15,49,98,.35);
  }
  header .kicker{font-size:11px; letter-spacing:.18em; text-transform:uppercase; opacity:.7; font-weight:700;}
  header h1{margin:2px 0 0; font-size:20px; font-weight:800; letter-spacing:-.01em;}
  header .comp{font-size:13px; opacity:.85; margin-top:2px; min-height:16px;}
  main{padding:14px 14px 20px; max-width:640px; margin:0 auto;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow-sm);}
  .sec-title{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:800; margin:2px 0 10px;}

  .summary{display:flex; gap:10px; margin-bottom:12px;}
  .stat{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; box-shadow:var(--shadow-sm);}
  .stat .n{font-size:22px; font-weight:800;}
  .stat .l{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}

  .empty{text-align:center; color:var(--muted); padding:30px 16px; font-size:14px;}
  .empty .big{font-size:30px; margin-bottom:6px;}

  .seg{display:flex; background:var(--teal-soft); border-radius:12px; padding:4px; margin-bottom:14px;}
  .seg button{flex:1; border:0; background:none; padding:9px; border-radius:8px; font-weight:800; font-size:14px; color:var(--muted); cursor:pointer; font-family:inherit;}
  .seg button.on{background:#fff; color:var(--teal-d); box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .cmmc{background:linear-gradient(120deg,#fff5e4,#fbe9cf); border:1.5px solid #f0d29a; border-radius:14px; padding:12px 14px; margin-bottom:14px; display:flex; align-items:center; gap:12px;}
  .cmmc .medal{font-size:26px;}
  .cmmc .t{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:#8a5a12;}
  .cmmc .who{font-weight:800; font-size:16px;}
  .cmmc .kg{margin-left:auto; font-size:20px; font-weight:800; color:#8a5a12;}
  .cmmc.loyal{background:linear-gradient(120deg,#e8f5e9,#d4ecd8); border-color:#b9dcc0;}
  .cmmc.loyal .t, .cmmc.loyal .kg{color:#2f6b3c;}

  table{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow-sm);}
  th,td{padding:9px 8px; text-align:left; font-size:14px;}
  th{background:var(--teal-soft); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:800;}
  td{border-top:1px solid var(--line);}
  td.pos{width:34px; font-weight:800; text-align:center;}
  td.kg{text-align:right; font-weight:800; width:70px;}
  td.small{color:var(--muted); font-size:12px;}
  tr.p1 td.pos{color:#a67c12;} tr.p1{background:#fdf6e6;}
  tr.p2 td.pos{color:#7d8686;}
  tr.p3 td.pos{color:#a5673c;}
  tr.pclick{cursor:pointer;}
  tr.pclick:active{background:var(--teal-soft);}
  tr.histrow td{background:#f5f8fc; border-top:0;}

  .hint{font-size:12px; color:var(--muted); margin:6px 0 0; line-height:1.4;}
  .complist{margin-top:4px;}

  .complist div:first-child{border-top:0;}
  .complist .cn{font-weight:700;}
  .complist .cd{color:var(--muted); font-size:12px;}

  .comp-card{border-top:1px solid var(--line); padding:10px 0;}
  .comp-card:first-child{border-top:0;}
  .comp-card-h{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px;}
  .comp-card-h .cn{font-weight:800; font-size:14px;}
  .comp-card-h .cd{font-size:11px; color:var(--muted); font-weight:700; white-space:nowrap;}
  .comp-podium-row{display:flex; justify-content:space-between; font-size:13px; padding:2px 0;}

  .row{display:flex; gap:8px;}
  .row>*{flex:1; min-width:0;}
  .mt{margin-top:10px;}
  button.btn{border:0; border-radius:12px; padding:12px 14px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; width:100%; transition:transform .1s ease, filter .15s ease;}
  button.btn:active{transform:scale(.98);}
  .btn-ghost{background:var(--teal-soft); color:var(--teal-d); border:1.5px solid var(--line);}

  /* Dark Premium – identic cu aplicația principală. Calculele sezonului rămân separate. */

  .place-badge,.podium-badge{display:inline-grid; place-items:center; font-weight:900; font-variant-numeric:tabular-nums;}

  .comp-card{margin:0 0 9px; padding:11px 12px; border:1px solid var(--line); border-radius:13px; background:#0d1823;}
  .comp-card:first-child{border-top:1px solid var(--line);}
  .comp-card-h{align-items:flex-start;}
  .comp-card-h .cd{color:#8599aa;}
  .comp-podium-row{align-items:center; padding:4px 0;}
  .comp-podium-row>span:first-child{display:flex; align-items:center; min-width:0;}
  .btn-ghost{background:#112634; color:#8cf2eb; border-color:#284454;}
  button.btn{display:flex; align-items:center; justify-content:center; gap:7px; min-height:46px;}
  .empty{border:1px dashed #294252; border-radius:18px; background:#0d1722;}
  .empty .ui-ico{width:34px; height:34px; color:var(--teal); margin-bottom:8px;}
  .loading-ring{width:32px; height:32px; margin:0 auto 12px; border:3px solid #203747; border-top-color:var(--teal); border-radius:50%; animation:seasonSpin .9s linear infinite;}

  @media (max-width:430px){
    th,td{padding:9px 6px; font-size:13px;}
    td.pos{width:32px;}

    .cmmc .kg{margin-left:54px; margin-top:-8px; width:calc(100% - 54px);}
    .row.action-row{display:grid; grid-template-columns:1fr;}
  }

  #printArea{display:none;}
  @media print{
    body>*:not(#printArea){display:none !important;}
    #printArea{display:block !important;}
  }
  .pr-h1{font-family:Georgia,serif; font-size:22pt; text-align:center; margin:0 0 4pt;}
  .pr-sub{text-align:center; font-size:11pt; color:#444; margin:0 0 10pt;}
  .pr-sec{font-size:13pt; font-weight:bold; margin:12pt 0 6pt; font-family:Georgia,serif;}
  .pr-t{width:100%; border-collapse:collapse; margin-bottom:12pt;}

  .pr-t th{background:#eee;}
  .pr-t td.c{text-align:center;}
  .pr-t td.r{text-align:right; font-weight:bold;}
</style>

<script>
  var API_BASE = "https://concurs-api.simionescu38.workers.dev";
  // concursuri ținute în afara sincronizării live (ex: exportate manual dintr-o alta instalare a aplicației)
  /* Rezerva: de obicei folderul arhiva/ se citește prin API-ul GitHub (listareArhivaGit).
     Când acela nu răspunde — limită de cereri — se cade pe lista asta, deci fiecare fișier
     nou trebuie trecut și aici, altfel concursul dispare din sezon exact când API-ul tace. */
  var ARCHIVE_FILES = [
    "arhiva/2026-07-29-braila-de-miercuri.json",
    "arhiva/2026-08-20-braila-rediu-galian.json",
    "arhiva/2026-08-21-braila-de-miercuri-remus-lake.json",
    "arhiva/2026-08-22-braila-remus-lake.json",
    "arhiva/2026-08-23-braila-remus-lake.json",
    "arhiva/2026-08-27-braila-rediu-galian-27-08-2026.json"
  ];
  var sortMode = "kg"; // "kg" | "pts"
  var season = null; // computed data, filled after load

  function num(v){ if(v===null||v===undefined) return 0; v=(""+v).trim().replace(",","."); var n=parseFloat(v); return isNaN(n)?0:n; }
  function fmt(n){ if(!n) return "0"; return (Math.round(n*1000)/1000).toFixed(3).replace(".",","); }
  // Locurile pot fi fracționare: media locurilor la egalitate dă jumătăți (2,5), iar
  // întinderea concursurilor mici pe scala sezonului dă și mai fin (3,25). Rotunjirea la
  // jumătate de punct ar arăta două punctaje diferite cu aceeași cifră, deci se taie la
  // două zecimale, fără zerouri la coadă: 2 → "2", 2,5 → "2,5", 3,25 → "3,25".
  function fmtPts(n){
    var v=(Math.round((+n||0)*10)/10).toFixed(1);
    return v.replace(/\.?0+$/,"").replace(".",",");
  }
  function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  // Numerele scrise în fața numelui („7.Fabian Cretu") sunt o numerotare de mână, rămasă în
  // arhivele făcute înainte ca aplicația să le curețe la sursă. Fără tăierea asta, același om
  // intră de două ori în sezon: numerotat în concursurile vechi, curat în cele noi — și niciunul
  // dintre cele două rânduri nu arată câte concursuri a făcut de fapt.
  function nameOf(p){
    var n = ((p.prenume||"")+" "+(p.nume||"")).trim();
    return n.replace(/^\s*\d{1,3}\s*[.)]\s*/, "");
  }
  function normKey(nm){
    var ZW = [0x200B,0x200C,0x200D,0x200E,0x200F,0xFEFF,0x2060];
    var out = "";
    for (var i=0;i<nm.length;i++){
      var c = nm.charCodeAt(i);
      if (ZW.indexOf(c)!==-1) continue;            // caractere invizibile (zero-width, BOM)
      if (c>=0xD800 && c<=0xDFFF) continue;         // jumătăți de surrogate pair (emoji din planuri superioare, ex: 🎣)
      if (c>=0x2600 && c<=0x27BF) continue;         // simboluri/emoji din BMP (dingbats)
      out += nm[i];
    }
    out = out.replace(/\s+/g, " ").trim().toLowerCase();
    // pliază diacriticele românești, ca "Săndel"/"Sandel" să se potrivească
    var DIA = {
      "ă":"a", "â":"a", "î":"i",
      "ș":"s", "ş":"s",
      "ț":"t", "ţ":"t"
    };
    var folded = "";
    for (var j=0;j<out.length;j++){
      var ch = out[j];
      folded += DIA[ch] || ch;
    }
    return folded;
  }

  /* Același om, scris în două feluri.
     Pe foaia scrisă de mână un nume iese uneori altfel: „Ciufi Man" într-un concurs,
     „Ciufy Man" în altul. Sezonul îi socotea ca doi pescari, fiecare cu jumătate din
     concursuri — iar pragul de participări îi lăsa pe amândoi neclasați, deși omul
     fusese la toate.
     Unirea NU se ghicește. „Paul Selig" și „Paul Pelin" diferă tot cu două litere și
     sunt doi pescari, amândoi pe aceeași foaie: o unire automată i-ar fi topit într-unul
     singur, tăcut. Deci lista se scrie de mână, în arhiva/acelasi-om.json.
     Fără fișier, sau cu el stricat, sezonul merge exact ca înainte. */
  var ACELASI = {};   // cheia unei scrieri -> {cheie, nume} ale omului adevărat
  async function incarcaAcelasiOm(){
    try{
      var r = await fetch(faraCache("arhiva/acelasi-om.json"));
      var j = await r.json();
      var grupuri = (j && Array.isArray(j.acelasi)) ? j.acelasi : [];
      grupuri.forEach(function(g){
        if(!Array.isArray(g) || g.length < 2) return;
        var bun = normKey(g[0]);
        if(!bun) return;
        g.forEach(function(nm){
          var k = normKey(nm);
          if(k) ACELASI[k] = {cheie:bun, nume:g[0]};
        });
      });
    }catch(e){ /* fără listă, fiecare scriere rămâne un om, ca până acum */ }
  }
  function cheiaOmului(nm){
    var k = normKey(nm);
    return (ACELASI[k] && ACELASI[k].cheie) || k;
  }
  function numeleOmului(nm){
    var k = normKey(nm);
    return (ACELASI[k] && ACELASI[k].nume) || nm;
  }

  function mOf(p, mi){
    if(p.m && p.m[mi]) return p.m[mi];
    if(mi===1 && !p.m){ return {catches:Array.isArray(p.catches)?p.catches:[], extras:Array.isArray(p.extras)?p.extras:[]}; }
    return {catches:[], extras:[]};
  }
  function catchesSum(p, mi){ var s=0; (mOf(p,mi).catches||[]).forEach(function(v){ s+=(+v||0); }); return s; }
  function extrasSum(p, mi){ var s=0; (mOf(p,mi).extras||[]).forEach(function(v){ s+=(+v||0); }); return s; }
  function extrasMax(p, mi){ var mx=0; (mOf(p,mi).extras||[]).forEach(function(v){ if((+v||0)>mx) mx=(+v||0); }); return mx; }
  // citește manșele direct din datele participantului (2 sau 3, sau formatul vechi fără p.m),
  // ca sezonul să nu depindă de un câmp separat "numManse" pe fiecare arhivă/cameră
  function totalKg(p){
    var chei = p.m ? Object.keys(p.m) : ((Array.isArray(p.catches)||Array.isArray(p.extras)) ? [1] : []);
    var s=0; chei.forEach(function(mi){ s+=catchesSum(p,mi)+extrasSum(p,mi); }); return s;
  }
  function bestFish(p){
    var chei = p.m ? Object.keys(p.m) : ((Array.isArray(p.catches)||Array.isArray(p.extras)) ? [1] : []);
    var mx=0; chei.forEach(function(mi){ var v=extrasMax(p,mi); if(v>mx) mx=v; }); return mx;
  }

  // Pragul de participări pentru a fi clasat pe puncte: jumătate din etapele ținute,
  // rotunjit în sus, minim 2 — dar niciodată mai mult decât s-a ținut, altfel într-un sezon
  // cu o singură etapă nimeni n-ar fi clasat.
  function pragSezon(nrEtape){ return Math.min(nrEtape, Math.max(2, Math.ceil(nrEtape/2))); }

  // Locurile unui concurs, întinse pe scala sezonului (`nMax` = cel mai numeros concurs).
  //
  // Locurile brute nu se pot compara între concursuri de mărimi diferite: ultimul dintr-un
  // concurs de 30 încasa 30 de puncte, ultimul dintr-unul de 10 doar 10, deși amândoi au
  // închis clasamentul la ei. Cine prindea etapele slab populate strângea puncte mici fără
  // să pescuiască mai bine. Aceeași corecție ca la sectoarele din aplicație.
  //
  // La greutăți egale locul e media locurilor ocupate de grup (convenția FIPS/CIPS), la fel
  // ca `pointsMapS` din index.html — altfel clasamentul de sezon divergea de cel de concurs.
  //
  // Formula e centrată pe locul din mijloc, ca un concurs cu un singur participant să dea
  // media scalei, nu locul întâi pe gratis. Cu concursuri de aceeași mărime factorul iese 1
  // și punctele rămân locurile. Suma unui concurs = n × (nMax+1) / 2.
  function placesOfComp(ranked, nMax){
    var n = ranked.length;
    var factor = n>1 ? (nMax-1)/(n-1) : 0;
    return ranked.map(function(row){
      var better = ranked.filter(function(o){ return o.kg > row.kg + 1e-9; }).length;
      var tied   = ranked.filter(function(o){ return Math.abs(o.kg - row.kg) <= 1e-9; }).length;
      var loc = better + (tied+1)/2;
      return (loc-(n+1)/2)*factor + (nMax+1)/2;
    });
  }

  function dateLabel(ms){
    if(!ms) return "";
    var d = new Date(ms);
    return d.toLocaleDateString("ro-RO",{day:"2-digit",month:"2-digit",year:"numeric"});
  }

  function rezultatHref(code){
    code=(code||"")+"";
    /* Se taie exact prefixul, nicio literă în plus: „arhiva:" are 7 caractere, iar
       „arhiva-api:" are 11. Cu o literă mâncată, adresa pleca „rhiva/2026-…json" și pagina
       de rezultate o refuza pe drept — „Adresă de arhivă invalidă" la fiecare concurs. */
    if(code.indexOf("arhiva-api:")===0) return "rezultat.html?id="+encodeURIComponent(code.slice("arhiva-api:".length));
    if(code.indexOf("arhiva:")===0) return "rezultat.html?file="+encodeURIComponent(code.slice("arhiva:".length));
    return "";
  }

  /* Un identificator intern (uuid, cale de fișier) nu e un nume de concurs —
     în clasament apărea „327269e3-ebde-4800-…" ca și cum ar fi o competiție. */
  function numeConcurs(brut, cand){
    var n = ((brut||"")+"").trim();
    if(n && !/^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(n)) return n;
    var d = cand ? new Date(cand) : null;
    return "Concurs fără nume" + (d && !isNaN(d.getTime()) ? " · " + d.toLocaleDateString("ro-RO") : "");
  }

  async function fetchLiveSources(){
    var roomsRes = await fetch(API_BASE+"/api/rooms").then(function(r){return r.json();}).catch(function(){ return null; });
    var rooms = (roomsRes && roomsRes.ok && roomsRes.rooms) ? roomsRes.rooms : [];
    var states = await Promise.all(rooms.map(function(r){
      return fetch(API_BASE+"/api/state?room="+encodeURIComponent(r.code))
        .then(function(res){ return res.json(); })
        .catch(function(){ return null; });
    }));
    var out = [];
    rooms.forEach(function(r, i){
      var res = states[i];
      if(!res || !res.ok || !res.data) return;
      var data = res.data;
      var parts = Array.isArray(data.participants) ? data.participants : [];
      if(!parts.length) return;
      /* O cameră live în care nu s-a cântărit încă NIMIC nu e un rezultat: ar
         intra în sezon cu toată lumea pe zero și ar umfla numărul de concursuri
         al fiecărui participant. Un concurs terminat rămâne în sezon chiar dacă
         s-a prins puțin — de aceea filtrul e doar pe camerele live, nu pe arhive. */
      var totalCamera = 0;
      parts.forEach(function(p){ totalCamera += totalKg(p); });
      if(totalCamera <= 0) return;
      out.push({
        compName: (data.name || r.name || r.code).trim() || r.code,
        compDate: data.startAt || (r.updated_at && Date.parse(r.updated_at)) || null,
        startAt: data.startAt || null,
        updatedAt: (r.updated_at && Date.parse(r.updated_at)) || null,
        balta: (data.balta||"").trim(),
        code: r.code,
        parts: parts
      });
    });
    return out;
  }

  // listă dinamică a folderului arhiva/ de pe GitHub, ca fișierele arhivate automat
  // (din butonul „Arhivează" din aplicație) să apară aici fără nicio modificare de cod.
  // ARCHIVE_FILES rămâne ca rezervă, dacă vreodată API-ul GitHub nu răspunde.
  /* Arhivele din depozit sunt DATE, nu fișiere ale aplicației: se schimbă fără ca
     aplicația să se schimbe. Fără cheia asta, browserul le ține până la zece minute
     (GitHub Pages trimite max-age=600), iar service worker-ul le-ar servi din memoria
     lui — așa că o îndreptare făcută azi în arhivă n-ar ajunge pe telefon nici mâine. */
  function faraCache(url){ return url + (url.indexOf("?") < 0 ? "?" : "&") + "cb=" + Date.now(); }
  async function listareArhivaGit(){
    try{
      var r = await fetch(faraCache("https://api.github.com/repos/simionescu38-dot/concursfeeder/contents/arhiva"));
      var list = await r.json();
      if(!Array.isArray(list)) return ARCHIVE_FILES.slice();
      var paths = list.filter(function(f){ return f && f.name && /\.json$/i.test(f.name); })
                       .map(function(f){ return "arhiva/"+f.name; });
      ARCHIVE_FILES.forEach(function(p){ if(paths.indexOf(p)===-1) paths.push(p); });
      return paths;
    }catch(e){ return ARCHIVE_FILES.slice(); }
  }

  async function fetchArchiveFiles(){
    var paths = await listareArhivaGit();
    var results = await Promise.all(paths.map(function(path){
      return fetch(faraCache(path)).then(function(r){return r.json();}).catch(function(){ return null; });
    }));
    var out = [];
    results.forEach(function(exp, i){
      if(!exp || !exp.data) return;
      var data = exp.data;
      var parts = Array.isArray(data.participants) ? data.participants : [];
      if(!parts.length) return;
      out.push({
        compName: numeConcurs(data.name, exp.exportedAt),
        compDate: data.startAt || (exp.exportedAt && Date.parse(exp.exportedAt)) || null,
        startAt: data.startAt || null,
        updatedAt: (exp.exportedAt && Date.parse(exp.exportedAt)) || null,
        balta: (data.balta||"").trim(),
        code: "arhiva:"+paths[i],
        parts: parts
      });
    });
    return out;
  }

  async function fetchArchiveApi(){
    var res = await fetch(API_BASE+"/api/archive").then(function(r){return r.json();}).catch(function(){ return null; });
    var list = (res && res.ok && res.archives) ? res.archives : [];
    var out = [];
    list.forEach(function(a){
      var data = a.data || {};
      var parts = Array.isArray(data.participants) ? data.participants : [];
      if(!parts.length) return;
      out.push({
        compName: numeConcurs(data.name || a.name, a.archived_at),
        compDate: data.startAt || (a.archived_at && Date.parse(a.archived_at)) || null,
        startAt: data.startAt || null,
        updatedAt: (a.archived_at && Date.parse(a.archived_at)) || null,
        balta: (data.balta||"").trim(),
        code: "arhiva-api:"+a.id,
        parts: parts
      });
    });
    return out;
  }

  async function fetchArchiveSources(){
    var results = await Promise.all([fetchArchiveFiles(), fetchArchiveApi()]);
    return results[0].concat(results[1]);
  }

  /* Aceeași competiție ajunge aici din mai multe surse: camera live ȘI arhiva
     făcută din ea, sau două arhivări ale aceluiași concurs. Fără filtrul ăsta
     erau numărate de fiecare dată — adică punctele și kilogramele acelorași
     oameni intrau de două ori în clasamentul de sezon.
     Identitatea unui concurs e CINE a pescuit și CÂND, nu cât s-a prins. Semnătura
     cuprindea și kilogramele, așa că o singură greutate corectată între două arhivări
     rupea concursul în două: la Brăila, 24,710 kg trecuți greșit și corectați la 10,400
     au făcut ca toți cei 12 oameni să intre de două ori în clasamentul de sezon.
     Ora de start e a concursului, deci identică în toate copiile lui; fără ea cădem pe
     ziua salvării, ca două arhivări la ore diferite din aceeași zi să se recunoască. */
  function semnatura(src){
    var oameni = src.parts.map(function(p){ return p.id||nameOf(p); }).sort().join("|");
    var cand = src.startAt ? ("s"+src.startAt)
             : (src.compDate ? ("z"+new Date(src.compDate).toISOString().slice(0,10)) : "");
    return oameni+"@"+cand;
  }
  /* Balta e scrisă de organizator, în Contul meu. Concursurile de dinainte de câmpul
     ăsta n-o au — pentru ele cade pe numele concursului, ca listele lor de standuri
     să apară totuși, sub un nume pe care omul îl recunoaște. */
  function cheiaLocatiei(src){
    return (src.balta||"").trim() || (src.compName||"").trim() || "Fără locație";
  }
  function faraDubluri(sources){
    var vazute = {}, out = [];
    sources.forEach(function(s){
      var k = semnatura(s);
      if(!k || vazute[k]){ return; }
      vazute[k] = true;
      out.push(s);
    });
    return out;
  }

  async function loadSeason(){
    await incarcaAcelasiOm();
    var liveSources = await fetchLiveSources();
    var archiveSources = await fetchArchiveSources();
    // Arhivele primele: au nume și dată stabile, camera live e doar o copie de moment.
    // Între arhivările aceluiași concurs rămâne cea mai nouă — adică cea în care
    // greutățile corectate sunt deja corectate.
    archiveSources.sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); });
    var sources = faraDubluri(archiveSources.concat(liveSources));
    if(!sources.length){
      throw new Error("Niciun concurs găsit.");
    }

    var byKey = {}; // name key -> aggregated record
    /* Standurile se numără PE BALTĂ. Standul 46 de la Remus Lake și standul 46 de la
       Rediu Galian sunt două locuri diferite; adunate la un loc, „cel mai productiv
       stand" nu spunea nimic despre nicio baltă. Concursurile de dinainte de câmpul
       „Balta" cad pe numele lor, ca să nu rămână o listă goală în urmă. */
    var byLoc = {}; // baltă -> { stand -> agregat }
    var comps = []; // list of processed competitions (for footer)
    var seasonFish = null; // {v, name, comp}

    // scala comună a sezonului: concursul cu cei mai mulți participanți
    var nMaxSezon = 0;
    sources.forEach(function(src){ if(src.parts.length > nMaxSezon) nMaxSezon = src.parts.length; });

    sources.forEach(function(src){
      var ranked = src.parts.map(function(p){
        return {p:p, kg:totalKg(p), fish:bestFish(p)};
      }).sort(function(a,b){ return b.kg - a.kg; });

      var top3 = ranked.filter(function(row){ return nameOf(row.p); }).slice(0,3).map(function(row){
        return {name:numeleOmului(nameOf(row.p)), kg:row.kg};
      });
      comps.push({name:src.compName, date:src.compDate, code:src.code, n:ranked.length, top3:top3});

      var places = placesOfComp(ranked, nMaxSezon);

      ranked.forEach(function(row, idx){
        var nm = nameOf(row.p);
        if(!nm) return;
        var key = cheiaOmului(nm);
        if(!key) return;
        if(!byKey[key]){
          byKey[key] = {name:numeleOmului(nm), totalKg:0, totalPoints:0, competitions:0, bestFish:0, bestFishComp:"", rows:[]};
        }
        var rec = byKey[key];
        var place = places[idx];
        rec.totalKg += row.kg;
        rec.totalPoints += place;
        rec.competitions += 1;
        rec.rows.push({comp:src.compName, date:src.compDate, place:place, kg:row.kg, fish:row.fish});
        if(row.fish > rec.bestFish){ rec.bestFish = row.fish; rec.bestFishComp = src.compName; }
        if(row.fish > 0 && (!seasonFish || row.fish > seasonFish.v)){
          seasonFish = {v:row.fish, name:numeleOmului(nm), comp:src.compName};
        }

        var stand = (row.p.stand || "").toString().trim();
        if(stand){
          var loc = cheiaLocatiei(src);
          if(!byLoc[loc]) byLoc[loc] = {};
          var st = byLoc[loc];
          if(!st[stand]) st[stand] = {stand:stand, totalKg:0, uses:0};
          st[stand].totalKg += row.kg;
          st[stand].uses += 1;
        }
      });
    });

    var list = Object.keys(byKey).map(function(k){ return byKey[k]; });
    // o listă de standuri pentru fiecare baltă, băltile cele mai pescuite primele
    var locStands = Object.keys(byLoc).map(function(loc){
      var standuri = Object.keys(byLoc[loc]).map(function(k){ return byLoc[loc][k]; })
        .sort(function(a,b){ return b.totalKg - a.totalKg; });
      var cantariri = standuri.reduce(function(a,x){ return a+x.uses; }, 0);
      return {loc:loc, standuri:standuri, cantariri:cantariri};
    }).sort(function(a,b){ return b.cantariri - a.cantariri; });
    comps.sort(function(a,b){ return (b.date||0)-(a.date||0); });

    var maxComp = 0;
    list.forEach(function(r){ if(r.competitions>maxComp) maxComp=r.competitions; });
    var mostLoyal = list.filter(function(r){ return r.competitions===maxComp; });

    var prag = pragSezon(comps.length);
    list.forEach(function(r){
      r.avgPoints = r.competitions ? r.totalPoints/r.competitions : 0;
      r.clasat = r.competitions >= prag;
    });

    return {list:list, comps:comps, seasonFish:seasonFish, locStands:locStands,
            mostLoyal:mostLoyal, prag:prag};
  }

    var rows = "";

      standHtml+
      '<div class="card" style="margin-top:14px;"><div class="sec-title"><svg class="ui-ico" aria-hidden="true"><use href="#i-history"></use></svg>Istoric concursuri</div>'+(compListHtml||'<span class="hint">Niciunul.</span>')+'</div>'+
      '<div class="card" style="margin-top:14px;"><div class="sec-title"><svg class="ui-ico" aria-hidden="true"><use href="#i-download"></use></svg>Backup</div>'+
        '<button class="btn btn-ghost" onclick="downloadSeasonBackup()"><svg class="ui-ico" aria-hidden="true"><use href="#i-download"></use></svg>Descarcă backup sezon (JSON)</button>'+
        '<p class="hint">Salvează pe telefon toate concursurile arhivate (din cloud și din cele adăugate manual în repo) — o plasă de siguranță, în caz că se întâmplă ceva cu baza de date.</p>'+
      '</div>';
  }

  function toast(m){ var t=document.createElement("div"); t.textContent=m; t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f1b2d;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.25);"; document.body.appendChild(t); setTimeout(function(){t.remove();},1600); }
  function fallbackCopy(txt){ var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast("Clasament copiat");}catch(e){toast("Nu am putut copia");} document.body.removeChild(ta); }
  function sortLabel(){ return sortMode==="kg" ? "După kg" : "După puncte"; }
  // Sortarea clasamentului de sezon, un singur loc pentru toate afișările (tabel, text
  // copiat, print, imagine) — cât era duplicată în patru, era ușor să divergă între ele.
  //
  // La puncte contează MEDIA locurilor pe etapele la care ai fost, nu suma: suma pedepsea
  // prezența, fiindcă fiecare etapă în plus adăuga puncte iar câștigă cine are mai puține.
  // Cine venea la o etapă și o câștiga bătea pe cine venea la toate și le câștiga pe toate.
  //
  // Media singură are însă o gaură: o singură apariție câștigată dă media perfectă 1, pe
  // care nimeni nu o poate întrece. De asta cei sub pragul de participări sunt scoși din
  // clasament (dar rămân în tabel, cu rezultatele lor) — vezi `clasat`.
  //
  // La medii egale departajează numărul de etape (mai multe câștigă), apoi kilogramele.
  // Altfel prezența ar fi pedepsită din nou, pe altă cale.
  function sortSeason(list){
    if(sortMode==="kg") return list.sort(function(a,b){ return b.totalKg - a.totalKg; });
    return list.sort(function(a,b){
      // neclasații stau la urmă, oricât de bună le-ar fi media
      if(a.clasat !== b.clasat) return a.clasat ? -1 : 1;
      var d=a.avgPoints-b.avgPoints; if(Math.abs(d)>1e-9) return d;
      var c=b.competitions-a.competitions; if(c) return c;
      return b.totalKg-a.totalKg;
    });
  }
  function currentSeasonSorted(){ return sortSeason(season.list.slice()); }
  /** Valoarea din coloana de puncte: media pe etapă, în amândouă filele.
      Arăta suma la „După kg" și media la „După puncte" — același cap de tabel („Pct"),
      aceeași explicație dedesubt (care vorbea doar despre medie), două înțelesuri. Suma
      nici nu semăna cu un loc: patru etape adunate dădeau 26,69. */
  function ptsAfisat(rec){ return rec.avgPoints; }
  /** numerotează doar clasații; neclasatul nu poartă loc. Un singur loc, ca tabelul,
      textul copiat, print-ul și imaginea să spună toate același lucru. */
  function pozitiiSezon(list){
    var loc=0, peP=sortMode!=="kg";
    return list.map(function(rec){
      var clasat = !peP || rec.clasat;
      if(clasat) loc++;
      return {rec:rec, clasat:clasat, loc:clasat?loc:null};
    });
  }

  function copySeasonText(){
    var list = currentSeasonSorted();
    var lines=["Clasament de sezon — "+sortLabel(), ""];
    if(season.seasonFish) lines.push("CMMC sezon: "+season.seasonFish.name+" — "+fmt(season.seasonFish.v)+" kg ("+season.seasonFish.comp+")");
    lines.push("");
    pozitiiSezon(list).forEach(function(p){
      lines.push((p.clasat ? p.loc+"." : "–")+" "+p.rec.name+" — "+fmtPts(ptsAfisat(p.rec))+" pct, "+
                 fmt(p.rec.totalKg)+" kg ("+p.rec.competitions+" concursuri"+(p.clasat?"":", neclasat")+")");
    });
    var txt=lines.join("\n");
    try{ navigator.clipboard.writeText(txt).then(function(){toast("Clasament copiat");},function(){fallbackCopy(txt);}); }
    catch(e){ fallbackCopy(txt); }
  }

  function printSeason(){
    var list = currentSeasonSorted();
    var h='<div class="pr-h1">Clasament de sezon</div><div class="pr-sub">'+esc(sortLabel())+' · '+season.comps.length+' concursuri · '+roDate()+'</div>';
    if(season.seasonFish) h+='<div class="pr-sub"><b>CMMC sezon:</b> '+esc(season.seasonFish.name)+' — '+fmt(season.seasonFish.v)+' kg</div>';
    h+='<div class="pr-sec">Clasament general</div><table class="pr-t"><tr><th>Loc</th><th>Concurent</th><th>Concursuri</th><th>Pct</th><th>Total kg</th></tr>';
    pozitiiSezon(list).forEach(function(p){
      h+='<tr><td class="c">'+(p.clasat?p.loc:'–')+'</td><td>'+esc(p.rec.name)+'</td><td class="c">'+p.rec.competitions+'</td>'+
         '<td class="c">'+fmtPts(ptsAfisat(p.rec))+'</td><td class="r">'+fmt(p.rec.totalKg)+'</td></tr>';
    });
    h+='</table>';
    document.getElementById("printArea").innerHTML=h;
    window.print();
  }

  function roDate(){
    var m=["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];
    var d=new Date(); return d.getDate()+" "+m[d.getMonth()]+" "+d.getFullYear();
  }
  function rr(x,px,py,w,h,r){ x.beginPath(); if(x.roundRect){ x.roundRect(px,py,w,h,r); } else { x.rect(px,py,w,h); } }
  function downloadBlob(b,name){ var a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500); toast("Imagine salvată"); }

  function shareSeasonImage(){
    if(!season || !season.list.length){ toast("Niciun rezultat de sezon"); return; }
    var logo=new Image();
    logo.onload=function(){ drawSeasonImage(logo); };
    logo.onerror=function(){ drawSeasonImage(null); };
    logo.src="icon-192.png";
  }
  function drawSeasonImage(logo){
    var pePuncte = sortMode!=="kg";
    // podiumul sezonului: neclasații nu apar deloc, ca numerotarea să nu mintă (pozitiiSezon).
    // Clasații apar însă TOȚI: tăietura la primii 10 lăsa restul sezonului pe dinafară.
    var poz=pozitiiSezon(currentSeasonSorted()).filter(function(p){ return p.clasat; });
    var arr=poz.map(function(p){ return p.rec; });
    var W=1080, ANTET=260, SUS=60, SUBSOL=60;
    var rowH=94;
    function inaltimea(rh){ return ANTET+SUS+(season.seasonFish?100:0)+arr.length*rh+SUBSOL; }
    /* Era tăiat la primii 10, pe o pânză fixă de 1440 — restul sezonului nu ajungea
       niciodată în poză. Acum pânza crește după listă, iar dacă ar ieși prea mare se
       strâng rândurile: mai bine rânduri dese decât nicio poză. */
    var H=inaltimea(rowH);
    while(H>8000 && rowH>44){ rowH-=6; H=inaltimea(rowH); }
    var sc=rowH/94;
    var fNume=Math.max(20,Math.round(38*sc)), fPct=Math.max(16,Math.round(30*sc));
    var boxH=Math.max(38,rowH-10);

    var c=document.createElement("canvas"); c.width=W; c.height=H;
    var x=c.getContext("2d");
    x.fillStyle="#070d14"; x.fillRect(0,0,W,H);
    var gr=x.createLinearGradient(0,0,0,ANTET);
    gr.addColorStop(0,"#0d2831"); gr.addColorStop(1,"#071018");
    x.fillStyle=gr; x.fillRect(0,0,W,ANTET);
    if(logo){ try{ x.drawImage(logo,44,56,150,150); }catch(e){} }
    x.fillStyle="#ffffff"; x.textAlign="center";
    x.font="bold 58px Georgia";
    x.fillText("Clasament de sezon", W/2+60, 120, W-320);
    x.font="bold 32px Arial"; x.fillStyle="rgba(255,255,255,.85)";
    x.fillText(sortLabel()+" · "+season.comps.length+" concursuri · "+roDate(), W/2+60, 180, W-320);

    var y=ANTET+SUS;
    if(season.seasonFish){
      x.fillStyle="#2d2414"; rr(x,60,y-20,W-120,80,16); x.fill();
      x.fillStyle="#f2c96b"; x.font="bold 34px Arial";
      x.fillText("CMMC sezon: "+season.seasonFish.name+" — "+fmt(season.seasonFish.v)+" kg", W/2, y+32, W-160);
      y+=100;
    }
    arr.forEach(function(rec,i){
      x.fillStyle = i===0 ? "#2a2416" : "#101d29";
      rr(x,60,y,W-120,boxH,16); x.fill();
      var mij=y+Math.round(boxH*0.62);
      x.fillStyle="#f4f8ff"; x.textAlign="left"; x.font="bold "+fNume+"px Arial";
      var loc=poz[i].loc;
      var medal = loc+".";
      x.fillText(medal, 92, mij);
      x.fillText(rec.name, 185, mij, pePuncte?380:540);
      x.textAlign="right";
      x.fillText(fmt(rec.totalKg)+" kg", W-92, mij);
      // antetul scria „După puncte" dar poza arăta doar kilograme: se vedea altă ordine
      // decât cea pe care o anunța, fără nicio explicație
      if(pePuncte){
        x.fillStyle="#19d3d1"; x.font="bold "+fPct+"px Arial";
        x.fillText(fmtPts(ptsAfisat(rec))+" pct", W-330, mij);
      }
      y+=rowH;
    });
    x.textAlign="center"; x.fillStyle="#8da2b5"; x.font="bold 26px Arial";
    x.fillText("Clasament de sezon — "+roDate(), W/2, H-28);
    c.toBlob(function(b){
      if(!b){ toast("Nu am putut genera imaginea"); return; }
      var f=null; try{ f=new File([b],"sezon.png",{type:"image/png"}); }catch(e){}
      if(f && navigator.canShare && navigator.canShare({files:[f]})){
        navigator.share({files:[f], title:"Clasament de sezon"}).catch(function(err){ if(err && err.name!=="AbortError") downloadBlob(b,"sezon.png"); });
      } else { downloadBlob(b,"sezon.png"); }
    },"image/png");
  }

  function downloadSeasonBackup(){
    toast("Se pregătește backup-ul…");
    Promise.all([
      fetch(API_BASE+"/api/archive").then(function(r){return r.json();}).catch(function(){return {ok:false, archives:[]};}),
      listareArhivaGit().then(function(paths){
        return Promise.all(paths.map(function(path){ return fetch(faraCache(path)).then(function(r){return r.json();}).catch(function(){return null;}); }));
      })
    ]).then(function(results){
      var apiArchives = (results[0] && results[0].ok) ? results[0].archives : [];
      var gitFiles = results[1].filter(Boolean);
      var backup = { exportedAt: new Date().toISOString(), apiArchives: apiArchives, gitArchiveFiles: gitFiles };
      var blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
      var d = new Date();
      var pad2 = function(n){ return (n<10?"0":"")+n; };
      var name = "backup-sezon-"+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+".json";
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast("Backup descărcat ("+apiArchives.length+" concursuri din cloud)");
    }).catch(function(){ toast("Eroare la generarea backup-ului"); });
  }

  function setSort(m){ sortMode=m; renderTable(); }
  window.setSort = setSort;

  function toggleHist(i){
    var el = document.getElementById("hist-"+i);
    if(!el) return;
    el.style.display = (el.style.display==="none") ? "table-row" : "none";
  }
  window.toggleHist = toggleHist;

  loadSeason().then(function(res){
    season = res;
    document.getElementById("subline").textContent = season.comps.length+" concursuri · "+season.list.length+" concurenți";
    if(!season.list.length){
      document.getElementById("content").innerHTML = '<div class="empty"><svg class="ui-ico" aria-hidden="true"><use href="#i-fish"></use></svg><div>Niciun rezultat găsit încă în concursuri.</div></div>';
      return;
    }
    renderTable();
  }).catch(function(err){
    document.getElementById("subline").textContent = "Eroare la încărcare";
    document.getElementById("content").innerHTML = '<div class="empty"><svg class="ui-ico" aria-hidden="true"><use href="#i-alert"></use></svg><div>Nu s-au putut încărca datele: '+esc(err.message||String(err))+'</div></div>';
  });
</script>
