<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Concursuri live – Cântar &amp; Clasament</title>
<meta name="theme-color" content="#070d14">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    color-scheme:dark;
    --pine:#f4f8ff; --teal:#19d3d1; --teal-d:#69ebe4; --teal-soft:#102d37;
    --bg:#070d14; --card:#101a25; --line:#22384a; --muted:#8da2b5;
    --shadow-sm:0 12px 30px -24px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(circle at 50% -100px,#12313c 0,var(--bg) 410px); color:var(--pine); font-size:16px; line-height:1.35;
    padding-bottom:40px;
  }
  header{
    background:rgba(7,13,20,.96); color:#fff; padding:20px 16px 18px;
    border-bottom:1px solid #16424b; box-shadow:0 12px 34px -28px rgba(25,211,209,.65); backdrop-filter:blur(14px);
  }
  .header-inner{max-width:520px; margin:0 auto;}
  .brand-row{display:flex; align-items:center; gap:12px;}
  .brand-mark{flex:0 0 48px; width:48px; height:48px; display:grid; place-items:center; border-radius:15px; color:var(--teal); background:#12303a; border:1px solid #28515a; box-shadow:0 0 22px rgba(25,211,209,.09);}
  .brand-mark .ui-ico{width:25px; height:25px;}
  .brand-copy{min-width:0;}
  header .kicker{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--teal); font-weight:800;}
  header h1{margin:2px 0 3px; font-size:23px; font-weight:850; letter-spacing:-.01em;}
  header p{margin:10px 0 0; font-size:12.5px; color:#a6b7c6; max-width:440px;}
  main{max-width:520px; margin:0 auto; padding:16px;}
  .ui-icons{position:absolute; width:0; height:0; overflow:hidden;}
  .ui-ico{width:18px; height:18px; display:inline-block; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto;}
  .card{
    position:relative; overflow:hidden; background:linear-gradient(145deg,#101d29,#0b141e); border:1px solid var(--line); border-radius:18px;
    padding:14px; margin-bottom:11px; box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--teal); opacity:.75;}
  .card .qr{flex:0 0 auto; width:58px; height:58px; padding:4px; border:1px solid #2b4555; border-radius:12px; background:#fff; overflow:hidden;}
  .card .qr svg{display:block; width:100%; height:100%;}
  .card-copy{flex:1; min-width:0;}
  .card-title{display:flex; align-items:center; gap:7px; min-width:0;}
  .live-dot{width:8px; height:8px; flex:0 0 8px; border-radius:50%; background:var(--teal); box-shadow:0 0 0 4px rgba(25,211,209,.10),0 0 12px rgba(25,211,209,.55);}
  .card .name{font-weight:850; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card .meta{font-size:11.5px; color:var(--muted); margin-top:4px;}
  .card a{
    flex:0 0 auto; width:42px; height:42px; display:grid; place-items:center; background:linear-gradient(135deg,#20e1d8,#19bfc8); color:#031011; text-decoration:none;
    border-radius:13px; box-shadow:0 10px 24px -16px rgba(25,211,209,.75);
  }
  .card a .ui-ico{width:20px; height:20px;}
  .card.flash{animation:flashUpdate 1.8s ease;}
  @keyframes flashUpdate{
    0%{box-shadow:0 0 0 2px var(--teal),0 0 26px rgba(25,211,209,.28); background:#12303a;}
    100%{box-shadow:var(--shadow-sm); background:#0b141e;}
  }
  .empty, .err{text-align:center; color:var(--muted); padding:38px 18px; font-size:14px; border:1px dashed #294252; border-radius:18px; background:#0d1722;}
  .empty .ui-ico,.err .ui-ico{display:block; width:34px; height:34px; margin:0 auto 10px; color:var(--teal);}
  .err .ui-ico{color:#ff8c84;}
  .loading-ring{width:32px; height:32px; margin:0 auto 12px; border:3px solid #203747; border-top-color:var(--teal); border-radius:50%; animation:liveSpin .9s linear infinite;}
  @keyframes liveSpin{to{transform:rotate(360deg);}}
  .footer-link{
    min-height:48px; display:flex; align-items:center; justify-content:center; gap:8px; text-align:center; margin-top:16px; padding:11px 14px; font-size:13px; color:var(--teal); font-weight:800; text-decoration:none; border:1px solid #284454; border-radius:14px; background:#112634;
  }
  .footer-link .ui-ico{width:18px; height:18px;}
  .status{text-align:center; font-size:11px; color:#718699; margin-top:14px;}
  @media(max-width:420px){
    .card{gap:10px; padding:12px;}
    .card .qr{width:52px; height:52px;}
    .card .name{font-size:14.5px;}
    .card a{width:40px; height:40px;}
  }
</style>
</head>
<body>

<svg class="ui-icons" aria-hidden="true">
  <symbol id="i-live" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.5 5.5a9 9 0 0 0 0 13M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10M9.5 20v-6h5v6"/></symbol>
  <symbol id="i-fish" viewBox="0 0 24 24"><path d="M4 12c3-5 8-7 13-4l4-3v14l-4-3c-5 3-10 1-13-4Z"/><circle cx="14.5" cy="11" r=".7" fill="currentColor" stroke="none"/><path d="M4 12H2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5M12 18h.01"/></symbol>
</svg>

<header>
  <div class="header-inner"><div class="brand-row">
    <div class="brand-mark"><svg class="ui-ico" aria-hidden="true"><use href="#i-live"></use></svg></div>
    <div class="brand-copy"><div class="kicker">Cântar &amp; Clasament</div><h1>Concursuri live</h1></div>
  </div><p>Toate camerele active de clasament live — apasă pe una ca să vezi rezultatele.</p></div>
</header>

<main>
  <div id="list"><div class="empty"><div class="loading-ring" aria-hidden="true"></div>Se încarcă concursurile live…</div></div>
  <a class="footer-link" href="index.html"><svg class="ui-ico" aria-hidden="true"><use href="#i-home"></use></svg>Organizezi un concurs? Deschide aplicația</a>
  <div class="status" id="status"></div>
</main>

<script src="qr.js"></script>
<script>
var API_BASE = "https://concurs-api.simionescu38.workers.dev";

function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function timeAgo(iso){
  try{
    var s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime())/1000));
    if(s<60) return "chiar acum";
    var m = Math.floor(s/60); if(m<60) return "acum "+m+" min";
    var h = Math.floor(m/60); if(h<24) return "acum "+h+" "+(h===1?"oră":"ore");
    var d = Math.floor(h/24); return "acum "+d+" "+(d===1?"zi":"zile");
  }catch(e){ return ""; }
}

var prevRooms = null; // null until after the first successful load — avoids flashing everything on first open

function render(rooms){
  var el = document.getElementById("list");
  if(!rooms.length){ el.innerHTML = '<div class="empty"><svg class="ui-ico" aria-hidden="true"><use href="#i-fish"></use></svg>Niciun concurs live momentan.<br>Revino mai târziu.</div>'; prevRooms = {}; return; }
  var prevMap = prevRooms || {};
  el.innerHTML = rooms.map(function(r){
    var link = location.href.replace(/concursuri\.html.*$/,"")+"index.html?room="+encodeURIComponent(r.code);
    // codul se desenează local; înainte venea de pe api.qrserver.com și la baltă,
    // cu semnal slab, nu se încărca deloc — exact acolo unde e nevoie de el
    var qrSvg = "";
    try{ qrSvg = QR.svg(link); }catch(e){}
    var changed = prevRooms!==null && prevMap[r.code]!==r.updated_at;
    return '<div class="card'+(changed?' flash':'')+'">'+
      '<div class="qr" role="img" aria-label="Cod QR spre clasamentul live">'+qrSvg+'</div>'+
      '<div class="card-copy"><div class="card-title"><span class="live-dot" aria-hidden="true"></span><div class="name">'+esc(r.name || "Concurs fără nume")+'</div></div>'+
      '<div class="meta">actualizat '+timeAgo(r.updated_at)+(changed?' · <b style="color:var(--teal-d);">tocmai acum</b>':'')+'</div></div>'+
      '<a href="index.html?room='+encodeURIComponent(r.code)+'" aria-label="Vezi clasamentul live"><svg class="ui-ico" aria-hidden="true"><use href="#i-arrow"></use></svg></a>'+
    '</div>';
  }).join("");
  var newMap = {};
  rooms.forEach(function(r){ newMap[r.code]=r.updated_at; });
  prevRooms = newMap;
}

function load(){
  fetch(API_BASE+"/api/rooms").then(function(r){ return r.json(); }).then(function(j){
    if(!j || !j.ok) throw new Error("bad response");
    render(j.rooms || []);
    document.getElementById("status").textContent = "Actualizat • " + new Date().toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"});
  }).catch(function(){
    document.getElementById("list").innerHTML = '<div class="err"><svg class="ui-ico" aria-hidden="true"><use href="#i-alert"></use></svg>Nu am putut încărca lista de concursuri. Verifică conexiunea la internet.</div>';
  });
}

load();
setInterval(load, 20000);
</script>

</body>
</html>
