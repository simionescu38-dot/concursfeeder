<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Concursuri live – Cântar &amp; Clasament</title>
<meta name="theme-color" content="#2f8ae6">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --pine:#eef3fa; --teal:#2f8ae6; --teal-d:#0f4fa8; --teal-soft:#17395c;
    --bg:#0a1220; --card:#131f30; --line:#26374d; --muted:#93a9c2;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--pine); font-size:16px; line-height:1.35;
    padding-bottom:40px;
  }
  header{
    background:linear-gradient(135deg,var(--teal) 0%,var(--teal-d) 100%);
    color:#fff; padding:20px 16px 18px;
    box-shadow:0 4px 20px -6px rgba(15,49,98,.35);
  }
  header .kicker{font-size:11px; letter-spacing:.18em; text-transform:uppercase; opacity:.7; font-weight:700;}
  header h1{margin:2px 0 6px; font-size:22px; font-weight:800; letter-spacing:-.01em;}
  header p{margin:0; font-size:13px; opacity:.85;}
  main{max-width:520px; margin:0 auto; padding:16px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .card .qr{flex:0 0 auto; width:52px; height:52px; border-radius:8px; background:#fff;}
  .card .name{font-weight:800; font-size:16px;}
  .card .meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .card a{
    flex:0 0 auto; background:linear-gradient(135deg,var(--teal) 0%,var(--teal-d) 100%); color:#fff; text-decoration:none;
    font-weight:700; font-size:13px; padding:9px 14px; border-radius:999px; white-space:nowrap;
    box-shadow:0 4px 12px -4px rgba(15,79,168,.5);
  }
  .card.flash{animation:flashUpdate 1.8s ease;}
  @keyframes flashUpdate{
    0%{box-shadow:0 0 0 3px var(--teal), var(--shadow-sm); background:var(--teal-soft);}
    100%{box-shadow:var(--shadow-sm); background:var(--card);}
  }
  .empty, .err{text-align:center; color:var(--muted); padding:40px 16px; font-size:14px;}
  .footer-link{
    display:block; text-align:center; margin-top:20px; font-size:13px; color:var(--teal-d); font-weight:700; text-decoration:none;
  }
  .status{text-align:center; font-size:12px; color:var(--muted); margin-top:18px;}
</style>
</head>
<body>

<header>
  <div class="kicker">Cântar &amp; Clasament</div>
  <h1>Concursuri live</h1>
  <p>Toate camerele active de clasament live — apasă pe unul ca să-l vezi, fără cod.</p>
</header>

<main>
  <div id="list"></div>
  <a class="footer-link" href="index.html">🎣 Organizezi un concurs? Deschide aplicația</a>
  <div class="status" id="status"></div>
</main>

<script>
var API_BASE = "https://concurs-api.simionescu38.workers.dev";

function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function timeAgo(iso){
  try{
    var s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime())/1000));
    if(s<60) return "chiar acum";
    var m = Math.floor(s/60); if(m<60) return "acum "+m+" min";
    var h = Math.floor(m/60); if(h<24) return "acum "+h+" "+(h===1?"oră":"ore");
    var d = Math.floor(h/24); return "acum "+d+" "+(d===1?"zi":"zile");
  }catch(e){ return ""; }
}

var prevRooms = null; // null until after the first successful load — avoids flashing everything on first open

function render(rooms){
  var el = document.getElementById("list");
  if(!rooms.length){ el.innerHTML = '<div class="empty">Niciun concurs live momentan.<br>Revino mai târziu.</div>'; prevRooms = {}; return; }
  var prevMap = prevRooms || {};
  el.innerHTML = rooms.map(function(r){
    var link = location.href.replace(/concursuri\.html.*$/,"")+"index.html?room="+encodeURIComponent(r.code);
    var qrSrc = "https://api.qrserver.com/v1/create-qr-code/?size=104x104&margin=0&data="+encodeURIComponent(link);
    var changed = prevRooms!==null && prevMap[r.code]!==r.updated_at;
    return '<div class="card'+(changed?' flash':'')+'">'+
      '<img class="qr" src="'+qrSrc+'" alt="Cod QR" loading="lazy">'+
      '<div style="flex:1; min-width:0;"><div class="name">'+esc(r.name || "Concurs fără nume")+'</div>'+
      '<div class="meta">actualizat '+timeAgo(r.updated_at)+(changed?' · <b style="color:var(--teal-d);">tocmai acum</b>':'')+'</div></div>'+
      '<a href="index.html?room='+encodeURIComponent(r.code)+'">Vezi live →</a>'+
    '</div>';
  }).join("");
  var newMap = {};
  rooms.forEach(function(r){ newMap[r.code]=r.updated_at; });
  prevRooms = newMap;
}

function load(){
  fetch(API_BASE+"/api/rooms").then(function(r){ return r.json(); }).then(function(j){
    if(!j || !j.ok) throw new Error("bad response");
    render(j.rooms || []);
    document.getElementById("status").textContent = "Actualizat • " + new Date().toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"});
  }).catch(function(){
    document.getElementById("list").innerHTML = '<div class="err">Nu am putut încărca lista de concursuri. Verifică conexiunea la internet.</div>';
  });
}

load();
setInterval(load, 20000);
</script>

</body>
</html>
