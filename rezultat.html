<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rezultate concurs — Feeder Moldova Iași</title>
<meta name="theme-color" content="#070d14">
<link rel="icon" href="icon-192.png">
<style>
  :root{color-scheme:dark;--bg:#070d14;--card:#101a25;--card2:#0c1721;--line:#22384a;--text:#f4f8ff;--muted:#8da2b5;--teal:#19d3d1;--teal2:#69ebe4;--gold:#f2c14e}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% -120px,#12313c 0,var(--bg) 430px);color:var(--text);font-size:16px;line-height:1.35;padding-bottom:28px}.num{font-variant-numeric:tabular-nums}
  .icons{position:absolute;width:0;height:0;overflow:hidden}.ico{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
  header{background:rgba(7,13,20,.96);border-bottom:1px solid #16424b;position:sticky;top:0;z-index:10;backdrop-filter:blur(14px)}.head{max-width:680px;margin:auto;padding:13px 14px;display:flex;gap:12px;align-items:center}.back{width:42px;height:42px;display:grid;place-items:center;color:var(--teal);border:1px solid #274253;border-radius:12px;background:#101d29;text-decoration:none;flex:0 0 auto}.head-copy{min-width:0}.kicker{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--teal);font-weight:800}.head-title{font-size:18px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{max-width:680px;margin:auto;padding:15px 14px}.hero{background:linear-gradient(145deg,#122531,#0b141e);border:1px solid #285060;border-radius:20px;padding:17px;margin-bottom:12px}.hero h1{font-size:24px;line-height:1.14;margin:0 0 7px;letter-spacing:-.02em}.meta{color:#a8bac8;font-size:13px;display:flex;gap:7px;flex-wrap:wrap}.meta span+span:before{content:"·";margin-right:7px;color:#526c7d}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:linear-gradient(145deg,#101d29,#0b141e);border:1px solid var(--line);border-radius:15px;padding:11px 9px;min-width:0}.stat .v{font-size:21px;font-weight:850;white-space:nowrap}.stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:750;margin-top:2px}
  .cmmc{display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,#2b2517,#18170f);border:1px solid #665225;border-radius:16px;padding:12px 13px;margin-bottom:12px}.cmmc .fish{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#342b18;color:var(--gold);flex:0 0 auto}.cmmc .t{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#e8c56b;font-weight:850}.cmmc .who{font-size:15px;font-weight:800}.cmmc .kg{margin-left:auto;font-size:18px;color:#f2c96b;font-weight:850;white-space:nowrap}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.btn{min-height:45px;border-radius:12px;border:1px solid #284454;background:#112634;color:#8cf2eb;font:800 14px inherit;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.btn:active{transform:scale(.98)}
  .qr-card{text-align:center}.qr-box{width:230px;max-width:100%;margin:4px auto 12px;padding:9px;background:#fff;border-radius:14px}.qr-link{font-size:11px;color:var(--muted);word-break:break-all;margin:0 0 11px}
  .tabs{display:flex;gap:5px;padding:5px;background:#09131d;border:1px solid var(--line);border-radius:13px;margin-bottom:12px;overflow-x:auto}.tabs button{flex:1;min-width:82px;min-height:42px;border:0;border-radius:9px;background:transparent;color:#8ca0b2;font:800 13px inherit;white-space:nowrap}.tabs button.on{background:#14303d;color:var(--teal)}
  .card{background:linear-gradient(145deg,#101d29,#0b141e);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:12px}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--teal);font-weight:850;margin:1px 2px 10px}.sector-title{font-size:13px;font-weight:850;margin:16px 1px 7px;color:#c7d8e4}.sector-title:first-child{margin-top:0}
  table{width:100%;border-collapse:collapse;background:var(--card2);border:1px solid var(--line);border-radius:13px;overflow:hidden}th,td{padding:9px 7px;text-align:left;font-size:13px}th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#91a6b8;background:#101f2c}td{border-top:1px solid var(--line)}tbody tr:nth-child(even) td{background:#0f1a25}td.pos{width:34px;text-align:center;font-weight:850}td.right{text-align:right;font-weight:800;white-space:nowrap}.place{width:28px;height:28px;display:inline-grid;place-items:center;border:1px solid #294252;border-radius:50%;background:#102431;font-size:11px}.p1 .place{background:linear-gradient(145deg,#ffe58d,#d99a2d);color:#281b03;border-color:#f5cc64}.p2 .place{background:linear-gradient(145deg,#eef5fa,#91a3b2);color:#17212a;border-color:#c5d1db}.p3 .place{background:linear-gradient(145deg,#efb188,#b7653f);color:#29140b;border-color:#dc946d}.sub{font-size:11px;color:var(--muted);margin-top:1px}.winner{color:var(--gold)}
  .loading,.error{text-align:center;color:var(--muted);padding:44px 18px;border:1px dashed #294252;border-radius:18px;background:#0d1722}.ring{width:32px;height:32px;margin:0 auto 12px;border:3px solid #203747;border-top-color:var(--teal);border-radius:50%;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16313b;color:#fff;border:1px solid #2f5c68;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:800;z-index:30;white-space:nowrap}
  @media(max-width:430px){main{padding-left:10px;padding-right:10px}.hero h1{font-size:21px}.stats{gap:6px}.stat .v{font-size:18px}.stat .l{font-size:9px}th,td{padding:8px 5px;font-size:12px}.actions{grid-template-columns:1fr}.cmmc{align-items:flex-start;flex-wrap:wrap}.cmmc .kg{margin-left:53px;margin-top:-8px;width:calc(100% - 53px)}}
</style>
</head>
<body>
<svg class="icons" aria-hidden="true"><symbol id="back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol><symbol id="share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.2M8.7 13.3l6.6 4.2"/></symbol><symbol id="link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"/></symbol><symbol id="fish" viewBox="0 0 24 24"><path d="M4 12c3-5 8-7 13-4l4-3v14l-4-3c-5 3-10 1-13-4Z"/><circle cx="14.5" cy="11" r=".7" fill="currentColor" stroke="none"/><path d="M4 12H2"/></symbol><symbol id="qr" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM19 14h2v7h-4M14 19h2v2h-2"/></symbol><symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol></svg>
<header><div class="head"><a class="back" href="sezon.html" aria-label="Înapoi la sezon"><svg class="ico"><use href="#back"/></svg></a><div class="head-copy"><div class="kicker">Feeder Moldova Iași</div><div class="head-title" id="headTitle">Rezultate concurs</div></div></div></header>
<main id="app"><div class="loading"><div class="ring"></div>Se încarcă rezultatele…</div></main>
<script src="qr.js"></script>
<script>
var API_BASE="https://concurs-api.simionescu38.workers.dev", state={participants:[],numManse:2}, arhiva=null, scope="total";
function esc(s){return String(s==null?"":s).replace(/[&<>\"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]})}
function fmt(n){if(!n)return"0";return(Math.round(n*1000)/1000).toFixed(3).replace(".",",")}
function fmtPts(n){var v=(Math.round((+n||0)*100)/100).toFixed(2);return v.replace(/\.?0+$/," ").trim().replace(".",",")}
function nameOf(p){return(((p.prenume||"")+" "+(p.nume||"")).trim()||"—").replace(/^\s*\d{1,3}\s*[.)]\s*/,"")}
function numManse(){return state.numManse||2}function manseRange(){var a=[];for(var i=1;i<=numManse();i++)a.push(i);return a}
function mOf(p,mi){if(p.m&&p.m[mi])return p.m[mi];if(mi===1&&!p.m)return{catches:p.catches||[],extras:p.extras||[],stand:p.stand||"",sector:p.sector||""};return{catches:[],extras:[],stand:"",sector:""}}
function sectorOfM(p,mi){var m=mOf(p,mi);return(m.sector!==undefined&&m.sector!==null)?m.sector:(p.sector||"")}function standOfM(p,mi){var m=mOf(p,mi);return(m.stand!==undefined&&m.stand!==null)?m.stand:(p.stand||"")}
function cantOfM(p,mi){if(mi==="total")return manseRange().reduce(function(s,i){return s+cantOfM(p,i)},0);return(mOf(p,mi).catches||[]).reduce(function(s,v){return s+(+v||0)},0)}
function extraOfM(p,mi){if(mi==="total")return manseRange().reduce(function(s,i){return s+extraOfM(p,i)},0);return(mOf(p,mi).extras||[]).reduce(function(s,v){return s+(+v||0)},0)}
function cmmcOfM(p,mi){if(mi==="total")return Math.max.apply(null,[0].concat(manseRange().map(function(i){return cmmcOfM(p,i)})));return Math.max.apply(null,[0].concat((mOf(p,mi).extras||[]).map(function(v){return+v||0})))}function totalOfM(p,mi){return cantOfM(p,mi)+extraOfM(p,mi)}
function absentLaMansa(p,mi){return!standOfM(p,mi)&&totalOfM(p,mi)<=1e-9}function mancheDisputata(mi){return state.participants.some(function(p){return totalOfM(p,mi)>1e-9})}function scalaSectoare(){return state.scalaSectoare===true}
function pointsMapS(mi){var secs={},abs=[];state.participants.forEach(function(p){if(absentLaMansa(p,mi)){abs.push(p);return}var k=sectorOfM(p,mi)||"Fără sector";(secs[k]=secs[k]||[]).push(p)});var nMax=0;Object.keys(secs).forEach(function(k){nMax=Math.max(nMax,secs[k].length)});var map={};Object.keys(secs).forEach(function(k){var arr=secs[k],n=arr.length,factor=scalaSectoare()?(n>1?(nMax-1)/(n-1):0):1,mijloc=scalaSectoare()?(nMax+1)/2:(n+1)/2;arr.forEach(function(p){var w=totalOfM(p,mi),better=arr.filter(function(o){return totalOfM(o,mi)>w+1e-9}).length,tied=arr.filter(function(o){return Math.abs(totalOfM(o,mi)-w)<=1e-9}).length,loc=better+(tied+1)/2;map[p.id]=(loc-(n+1)/2)*factor+mijloc})});abs.forEach(function(p){map[p.id]=nMax+1});return map}
function pointsCombo(){var maps=manseRange().filter(mancheDisputata).map(pointsMapS),map={};state.participants.forEach(function(p){map[p.id]=maps.reduce(function(s,m){return s+(m[p.id]||0)},0)});return map}
function bestMancheOf(p){return Math.max.apply(null,[0].concat(manseRange().map(function(i){return totalOfM(p,i)})))}function standKey(p,mi){var n=parseFloat(standOfM(p,mi));return isNaN(n)?999999:n}
function sortByPoints(arr,pmap,mi){return arr.slice().sort(function(a,b){var d=pmap[a.id]-pmap[b.id];if(Math.abs(d)>1e-9)return d;d=totalOfM(b,mi)-totalOfM(a,mi);if(Math.abs(d)>1e-9)return d;if(mi==="total"){d=bestMancheOf(b)-bestMancheOf(a);if(Math.abs(d)>1e-9)return d}d=cmmcOfM(b,mi)-cmmcOfM(a,mi);if(Math.abs(d)>1e-9)return d;return standKey(a,mi)-standKey(b,mi)||nameOf(a).localeCompare(nameOf(b),"ro")})}
function dateLabel(v){if(!v)return"";var d=new Date(v);return isNaN(d.getTime())?"":d.toLocaleDateString("ro-RO",{day:"2-digit",month:"long",year:"numeric"})}
function param(n){return new URLSearchParams(location.search).get(n)}function faraCache(u){return u+(u.indexOf("?")<0?"?":"&")+"cb="+Date.now()}
async function load(){var exp=null,meta={};if(param("file")){var path=param("file");if(!/^arhiva\/[a-z0-9._-]+\.json$/i.test(path))throw Error("Adresă de arhivă invalidă.");exp=await fetch(faraCache(path)).then(function(r){if(!r.ok)throw Error();return r.json()});meta.exportedAt=exp.exportedAt}else if(param("id")){var res=await fetch(API_BASE+"/api/archive").then(function(r){return r.json()});var a=(res.archives||[]).find(function(x){return String(x.id)===param("id")});if(!a)throw Error("Concursul nu a fost găsit.");exp={data:a.data};meta.exportedAt=a.archived_at;meta.name=a.name}else throw Error("Lipsește concursul din adresă.");state=exp.data||{};state.participants=Array.isArray(state.participants)?state.participants:[];if(!state.participants.length)throw Error("Arhiva nu conține participanți.");arhiva=meta;render()}
function bestFish(mi){var best=null;state.participants.forEach(function(p){var v=cmmcOfM(p,mi);if(v>0&&(!best||v>best.v))best={p:p,v:v}});return best}
function row(p,i,pmap,mi,showSector){return'<tr class="p'+(i+1)+'"><td class="pos"><span class="place">'+(i+1)+'</span></td><td>'+esc(nameOf(p))+'<div class="sub">Stand '+esc(standOfM(p,mi)||"–")+(showSector&&sectorOfM(p,mi)?' · Sector '+esc(sectorOfM(p,mi)):'')+'</div></td><td class="right num">'+fmtPts(pmap[p.id])+' pct</td><td class="right num">'+fmt(totalOfM(p,mi))+' kg</td></tr>'}
function generalHtml(){var map=pointsCombo(),list=sortByPoints(state.participants,map,"total");return'<div class="card"><div class="section-title">Clasament general</div><table><thead><tr><th>#</th><th>Concurent</th><th style="text-align:right">Puncte</th><th style="text-align:right">Total</th></tr></thead><tbody>'+list.map(function(p,i){return row(p,i,map,"total",false)}).join("")+'</tbody></table></div>'}
function mancheHtml(mi){var map=pointsMapS(mi),secs={};state.participants.forEach(function(p){if(absentLaMansa(p,mi))return;var k=sectorOfM(p,mi)||"Fără sector";(secs[k]=secs[k]||[]).push(p)});var out='<div class="card"><div class="section-title">Rezultate Manșa '+mi+'</div>';Object.keys(secs).sort().forEach(function(k){var list=sortByPoints(secs[k],map,mi);out+='<div class="sector-title">Sector '+esc(k)+'</div><table><thead><tr><th>#</th><th>Concurent</th><th style="text-align:right">Puncte</th><th style="text-align:right">Total</th></tr></thead><tbody>'+list.map(function(p,i){return row(p,i,map,mi,false)}).join("")+'</tbody></table>'});return out+'</div>'}
function render(){var name=(state.name||arhiva.name||"Concurs").trim(),date=dateLabel(state.startAt||arhiva.exportedAt),balta=(state.balta||state.location||"").trim(),disputate=manseRange().filter(mancheDisputata),total=state.participants.reduce(function(s,p){return s+totalOfM(p,"total")},0),fish=bestFish("total");document.title=name+" — Rezultate";document.getElementById("headTitle").textContent=name;var tabs='<div class="tabs"><button class="'+(scope==="total"?"on":"")+'" onclick="setScope(\'total\')">General</button>'+disputate.map(function(i){return'<button class="'+(scope===i?"on":"")+'" onclick="setScope('+i+')">Manșa '+i+'</button>'}).join("")+'</div>';document.getElementById("app").innerHTML='<section class="hero"><h1>'+esc(name)+'</h1><div class="meta">'+(date?'<span>'+esc(date)+'</span>':'')+(balta?'<span>'+esc(balta)+'</span>':'')+'<span>Rezultate oficiale arhivate</span></div></section><div class="stats"><div class="stat"><div class="v num">'+state.participants.length+'</div><div class="l">Participanți</div></div><div class="stat"><div class="v num">'+disputate.length+'</div><div class="l">Manșe</div></div><div class="stat"><div class="v num">'+fmt(total)+'</div><div class="l">Kg total</div></div></div>'+(fish?'<div class="cmmc"><div class="fish"><svg class="ico"><use href="#fish"/></svg></div><div><div class="t">Cel mai mare pește</div><div class="who">'+esc(nameOf(fish.p))+'</div></div><div class="kg num">'+fmt(fish.v)+' kg</div></div>':'')+'<div class="actions"><button class="btn" onclick="sharePage()"><svg class="ico"><use href="#share"/></svg>Distribuie rezultatele</button><button class="btn" onclick="toggleQr()"><svg class="ico"><use href="#qr"/></svg>Arată codul QR</button></div><div id="qrCard" class="card qr-card" hidden><div class="section-title">Cod QR pentru rezultate</div><div id="qrBox" class="qr-box"></div><p class="qr-link">'+esc(location.href)+'</p><button class="btn" onclick="salveazaQr()"><svg class="ico"><use href="#download"/></svg>Salvează codul QR</button></div>'+tabs+(scope==="total"?generalHtml():mancheHtml(scope))}
function setScope(v){scope=v;render();scrollTo({top:0,behavior:"smooth"})}function toast(t){var e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},1700)}
function copyLink(){navigator.clipboard&&navigator.clipboard.writeText(location.href).then(function(){toast("Link copiat")}).catch(function(){toast("Nu am putut copia")})}function sharePage(){if(navigator.share){navigator.share({title:document.title,text:"Rezultatele concursului "+(state.name||""),url:location.href}).catch(function(){})}else copyLink()}
function toggleQr(){var card=document.getElementById("qrCard"),box=document.getElementById("qrBox");card.hidden=!card.hidden;if(!card.hidden&&!box.innerHTML){try{box.innerHTML=QR.svg(location.href)}catch(e){toast("Codul QR nu a putut fi creat")}}}
function qrPng(){return new Promise(function(resolve,reject){var svg=QR.svg(location.href),img=new Image(),blob=new Blob([svg],{type:"image/svg+xml"}),url=URL.createObjectURL(blob);img.onload=function(){var c=document.createElement("canvas");c.width=c.height=900;c.getContext("2d").drawImage(img,0,0,900,900);URL.revokeObjectURL(url);c.toBlob(function(b){b?resolve(b):reject()},"image/png")};img.onerror=reject;img.src=url})}
async function salveazaQr(){try{var blob=await qrPng(),file=new File([blob],"rezultate-qr.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:document.title})}else{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);toast("Codul QR a fost salvat")}}catch(e){toast("Nu am putut salva codul QR")}}
load().catch(function(e){document.getElementById("app").innerHTML='<div class="error"><strong>Rezultatele nu se pot încărca.</strong><div class="sub" style="margin-top:7px">'+esc(e.message||"Verifică legătura și încearcă din nou.")+'</div></div>'})
</script>
</body>
</html>
